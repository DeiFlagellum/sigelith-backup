[project]
name = "cleanvault"
version = "3.0.0"
description = "Sigelith Backup — lokalne kopie zapasowe z szyfrowaniem AES-256-GCM"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pycryptodomex>=3.20",
    "msgpack>=1.0",
    "argon2-cffi>=23.1",
    "keyring>=25.0",
    "fastcdc>=1.7",
    "click>=8.0",
    "py_ecc>=8.0",
    "watchdog>=6.0",
    "winrt-runtime>=3.2; sys_platform == 'win32'",
    "winrt-Windows.ApplicationModel>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
# botocore: wyłącznie wyrocznia w teście podpisu S3 — program go nie używa
dev = ["pytest>=8.0", "pyinstaller>=6.0", "ruff>=0.6", "botocore>=1.34"]

[project.gui-scripts]
cleanvault = "app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::SyntaxWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "venv", "build", "dist", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE"]
ignore = [
    "E501",    # długość linii pilnuje formatter
    "RUF001",  # polskie znaki diakrytyczne w łańcuchach to nie pomyłka
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "SIM117"]
# Skrypt ratunkowy trafia do katalogu kopii i ma działać na Pythonie 3.8 u kogoś,
# kto programu nie ma — reguły „unowocześniające” składnię nie mogą go dotykać.
"assets/recovery/*" = ["UP"]
